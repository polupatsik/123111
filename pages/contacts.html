<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Контакты</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style/styles.css"></head>
<body>
  <header class="header py-3 mb-3">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="site-logo">Дружков M.M.</div>
        <div class="text-muted">ЭФБО-07-24</div>
      </div>
      <div class="header__actions">
        <button class="theme-toggle btn btn-outline-secondary">🌙</button>
      </div>
    </div>
  </header>

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand site-logo" href="../index.html">Портфолио</a>
    </div>
  </nav>

  <main class="container mb-5">
    <h1>Контакты</h1>

    <form id="contactForm" class="mb-3">
      <div class="mb-3"><label class="form-label">Имя</label><input class="form-control" id="name" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
      <div class="mb-3"><label class="form-label">Сообщение</label><textarea class="form-control" id="message" rows="5" required></textarea></div>
      <button class="btn btn-primary" type="submit">Отправить</button>
    </form>

    <h3>Другие контакты</h3>
    <p>📧 student@edu.ru<br>📱 GitHub: polupatsik</p>
  </main>

  <footer class="footer mt-5"><div class="container text-center">© 2025 Дружков Михаил</div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e){
      e.preventDefault();
      alert('Спасибо! Форма отправлена (демо).');
      this.reset();
    });

    (function(){
      const root = document.documentElement;
      const stored = localStorage.getItem('theme');
      if(stored) root.setAttribute('data-theme', stored);
      document.querySelectorAll('.theme-toggle').forEach(b => b.textContent = root.getAttribute('data-theme') === 'dark' ? '🌞' : '🌙');
      document.addEventListener('click', function(e){
        if(e.target && e.target.classList && e.target.classList.contains('theme-toggle')){
          const cur = root.getAttribute('data-theme');
          const next = cur === 'dark' ? '' : 'dark';
          if(next) root.setAttribute('data-theme', next); else root.removeAttribute('data-theme');
          localStorage.setItem('theme', next);
          document.querySelectorAll('.theme-toggle').forEach(b => b.textContent = root.getAttribute('data-theme') === 'dark' ? '🌞' : '🌙');
        }
      });
    })();
  </script>
</body>
</html>
